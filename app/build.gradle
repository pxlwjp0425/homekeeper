plugins {
    id 'com.android.application'
}

android {
    // namespace 只用于生成 R 类，真正决定包名的是下面的 applicationId
    namespace 'com.laopeng.homekeeper'
    compileSdk 35

    defaultConfig {
        // 关键：借用固件启动器白名单里“已登记但未安装”的包名，
        // 从而绕过 PackageManagerService.filterHomeApp 的品牌黑名单过滤
        applicationId "com.xiaopaitech.wallpaperlauncher"
        minSdk 21
        targetSdk 29
        // 版本号一律三段式 x.y.z：大=不兼容/架构级，中=新增功能，小=修 bug/微调
        // 4.8.0：录制期间悬浮信息条 + 顶栏时钟/天气自动收起（新增功能 → 中版本）
        // 4.9.1：移除音频看门狗 / 音频诊断（setSpeakerphone 纠声功能整体删除）
        // 4.11.0：新增可交互悬浮工具条（清内存/录屏开关/重启/关机），悬浮在任意 App 之上
        // 4.12.0：工具条改纯触摸（不抢遥控焦点）、默认停屏幕最上方居中、长按可拖动并记住位置、
        //         小框宽度按内容自适应（更窄）、桌面设置菜单新增「悬浮工具条」开关
        versionCode 39
        versionName "4.12.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
